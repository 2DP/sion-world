<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SION WORLD - GitHub Pages</title>
    <meta name="description" content="GitHub Pages용 SION WORLD 예제 페이지입니다." />
    <style>
      :root {
        --bg: #0b1020;
        --card: #121b2d;
        --text: #edf4ff;
        --muted: #a8b5d1;
        --primary: #7c9cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, rgba(124, 156, 255, 0.2), transparent 30%), #0b1020;
        color: var(--text);
      }
      .card {
        width: min(560px, calc(100% - 32px));
        background: rgba(18, 27, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 40px 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0,0,0,0.28);
      }
      .label {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(124, 156, 255, 0.12);
        color: #a7bbff;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-block;
        background: linear-gradient(135deg, var(--primary), #a8c0ff);
        color: #08111d;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="label">GitHub Pages</div>
      <h1>SION WORLD</h1>
      <p>
        GitHub Pages에서 열리는 기본 페이지입니다. 잠시 후 예제 페이지로 이동합니다.
      </p>
      <a href="./example1/">예제 페이지 바로가기</a>
    </main>

    <script>
      setTimeout(() => {
        window.location.href = './example1/';
      }, 1200);
    </script>
  </body>
</html>
