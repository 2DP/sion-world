<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛 비트 화면 크기 검증</title><style>body{margin:0;background:#0b0c18;color:#eee;font:12px system-ui}nav{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{background:#c7b2ff;border:0;border-radius:6px;padding:8px;cursor:pointer}#frame{border:0;transform-origin:top left;display:block;background:#111326}#status{padding:8px 12px;line-height:1.7}#wrap{overflow:hidden}</style><nav><strong>화면 검증</strong><button data-width="1120">PC 1120</button><button data-width="360">모바일 360</button><button data-width="768">태블릿 768</button></nav><div id="status">불러오는 중</div><div id="wrap"><iframe id="frame" src="/" title="별빛 비트 테스트 화면"></iframe></div><script>
const frame=document.getElementById('frame'),wrap=document.getElementById('wrap'),status=document.getElementById('status');let chosen=1120;
function size(){const scale=Math.min(1,innerWidth/chosen);frame.style.width=chosen+'px';frame.style.height='900px';frame.style.transform='scale('+scale+')';wrap.style.height=900*scale+'px';if(frame.contentDocument?.body){const doc=frame.contentDocument;const overflow=doc.documentElement.scrollWidth>chosen;status.textContent=chosen+'px · 가로 넘침 '+(overflow?'있음':'없음')+' · '+(doc.querySelector('#menu')?.hidden?'연주 / 결과':'곡 선택');}}
frame.addEventListener('load',size);window.addEventListener('resize',size);document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.width);size();});
</script></html>
