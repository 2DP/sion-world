<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛 비트 음악 검증</title><style>body{font:14px system-ui;background:#151529;color:#eee;padding:24px;line-height:1.7}button,a{background:#c7b2ff;color:#211836;border:0;border-radius:8px;padding:12px;display:inline-block}article{padding:18px;margin-top:18px;border:1px solid #ffffff30;border-radius:12px}audio{display:block;width:100%;margin:12px 0}.pass{color:#8ee7d3}.fail{color:#ff98ab}</style><h1>댄스 편곡 오디오 검증</h1><p>실제 Web Audio 렌더링의 채널 수·최대 진폭·유효 샘플을 검사합니다. 아래 미리 듣기는 각 곡의 첫 후렴 12초입니다.</p><button id="run">세 곡 렌더링 검사</button><div id="results" aria-live="polite"></div><script src="../charts.js"></script><script src="../audio.js"></script><script>
function wav(buffer,start,seconds){const offset=Math.floor(start*buffer.sampleRate),frames=Math.min(buffer.length-offset,Math.floor(seconds*buffer.sampleRate)),channels=buffer.numberOfChannels,bytes=frames*channels*2;const data=new ArrayBuffer(44+bytes),v=new DataView(data);function s(at,text){for(let i=0;i<text.length;i++)v.setUint8(at+i,text.charCodeAt(i));}s(0,'RIFF');v.setUint32(4,36+bytes,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,bytes,true);for(let i=0;i<frames;i++)for(let c=0;c<channels;c++)v.setInt16(44+(i*channels+c)*2,Math.round(Math.max(-1,Math.min(1,buffer.getChannelData(c)[offset+i]))*32767),true);return new Blob([data],{type:'audio/wav'});}
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;const output=document.querySelector('#results');output.replaceChildren();try{for(const song of Starbeat.songs){const article=document.createElement('article');article.textContent=song.title+' · 렌더링 중';output.append(article);const started=performance.now();const buffer=await Starbeat.renderSong(song);let peak=0,energy=0,invalid=0,stereoDifference=0;for(let c=0;c<buffer.numberOfChannels;c++){const samples=buffer.getChannelData(c);for(const value of samples){if(!Number.isFinite(value))invalid++;peak=Math.max(peak,Math.abs(value));energy+=value*value;}}for(let i=0;i<buffer.length;i++)stereoDifference+=Math.abs(buffer.getChannelData(0)[i]-buffer.getChannelData(1)[i]);const rms=Math.sqrt(energy/(buffer.length*buffer.numberOfChannels));const pass=invalid===0&&peak<=.881&&rms>.015&&stereoDifference>1;let firstChorus=0;while(Starbeat.sectionAt(song,firstChorus)!=='chorus')firstChorus++;const url=URL.createObjectURL(wav(buffer,firstChorus*240/song.bpm,12));article.innerHTML='<h2>'+song.title+'</h2><p class="'+(pass?'pass':'fail')+'">'+(pass?'PASS':'FAIL')+' · '+buffer.numberOfChannels+'채널 · '+buffer.duration.toFixed(2)+'초 · peak '+peak.toFixed(4)+' · RMS '+rms.toFixed(4)+' · invalid '+invalid+' · '+((performance.now()-started)/1000).toFixed(2)+'초 소요</p><audio controls src="'+url+'"></audio><a href="'+url+'" download="'+song.id+'-chorus.wav">후렴 WAV 저장</a>';}}catch(error){output.append(Object.assign(document.createElement('p'),{textContent:'FAIL: '+error.message,className:'fail'}));}finally{button.disabled=false;}};
</script></html>
